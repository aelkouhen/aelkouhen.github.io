<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Postman Buyer Persona Playbook — Solution Architect Edition</title>
<style>
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --surface-2: #f0f2f5;
    --border: #dfe3e8;
    --border-strong: #c7ccd4;
    --text: #16191d;
    --text-2: #4d5560;
    --text-3: #767f8c;
    --accent: #ff6c37;
    --accent-text: #b8420f;
    --accent-soft: #fff1ea;
    --speed: #1d6fd0;
    --speed-soft: #e8f1fc;
    --risk: #7b41c9;
    --risk-soft: #f2eafc;
    --outcome: #0f7a52;
    --outcome-soft: #e6f5ef;
    --cost: #96601a;
    --cost-soft: #fbf1e2;
    --shadow: 0 1px 2px rgba(16,20,26,.06), 0 4px 16px rgba(16,20,26,.05);
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101216;
      --surface: #181b21;
      --surface-2: #1f232a;
      --border: #2b3038;
      --border-strong: #3b424c;
      --text: #eef0f3;
      --text-2: #b3bac4;
      --text-3: #848d99;
      --accent: #ff6c37;
      --accent-text: #ff9166;
      --accent-soft: #2a1a12;
      --speed: #6ba9ee;
      --speed-soft: #16222f;
      --risk: #b48ce8;
      --risk-soft: #211a2e;
      --outcome: #4fc194;
      --outcome-soft: #12241d;
      --cost: #dda44f;
      --cost-soft: #29200f;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, h4 { margin: 0; font-weight: 620; letter-spacing: -0.011em; }

  /* ---------- Layout ---------- */
  .app { display: grid; grid-template-columns: 268px minmax(0, 1fr); min-height: 100vh; }
  @media (max-width: 880px) { .app { grid-template-columns: 1fr; } }

  /* ---------- Sidebar ---------- */
  .side {
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 22px 16px 32px;
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
  }
  @media (max-width: 880px) { .side { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--border); } }

  .brand { display: flex; align-items: center; gap: 10px; padding: 0 8px 18px; }
  .brand-dot { width: 22px; height: 22px; border-radius: 50%; background: var(--accent); flex: none; }
  .brand-name { font-size: 14px; font-weight: 660; letter-spacing: -0.01em; }
  .brand-sub { font-size: 11.5px; color: var(--text-3); margin-top: 1px; }

  .nav-label { font-size: 10.5px; font-weight: 680; letter-spacing: .07em; text-transform: uppercase; color: var(--text-3); padding: 12px 8px 7px; }

  .nav-item {
    display: grid; grid-template-columns: 40px minmax(0,1fr); gap: 10px; align-items: center;
    width: 100%; text-align: left; cursor: pointer;
    background: transparent; border: 1px solid transparent; border-radius: 10px;
    padding: 8px; margin-bottom: 2px; color: inherit; font: inherit;
  }
  .nav-item:hover { background: var(--surface-2); }
  .nav-item[aria-current="true"] { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 32%, transparent); }
  .nav-item:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .tag {
    width: 40px; height: 30px; border-radius: 7px; display: grid; place-items: center;
    font-size: 10px; font-weight: 720; letter-spacing: .03em;
    background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border);
  }
  .nav-item[aria-current="true"] .tag { background: var(--accent); color: #fff; border-color: transparent; }
  .nav-title { font-size: 13.5px; font-weight: 570; line-height: 1.25; }
  .nav-meta { font-size: 11px; color: var(--text-3); margin-top: 3px; display: flex; align-items: center; gap: 6px; }
  .mini-bar { flex: 1; height: 3px; border-radius: 2px; background: var(--border); overflow: hidden; max-width: 62px; }
  .mini-bar > i { display: block; height: 100%; background: var(--accent); width: 0%; transition: width .2s ease; }

  .side-foot { margin-top: 18px; padding: 12px 8px 0; border-top: 1px solid var(--border); font-size: 11.5px; color: var(--text-3); }
  .kbd { font: 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--surface-2); border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px; padding: 3px 5px; color: var(--text-2); }

  /* ---------- Main ---------- */
  .main { padding: 30px clamp(18px, 4vw, 44px) 80px; max-width: 1080px; }

  .head { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start; justify-content: space-between; margin-bottom: 6px; }
  .head h1 { font-size: 27px; }
  .role-line { color: var(--text-2); font-size: 14.5px; margin-top: 7px; max-width: 62ch; }

  .badges { display: flex; flex-wrap: wrap; gap: 7px; margin: 14px 0 26px; }
  .badge {
    font-size: 11.5px; font-weight: 600; padding: 4px 10px; border-radius: 999px;
    border: 1px solid var(--border-strong); color: var(--text-2); background: var(--surface);
  }
  .badge.speed   { color: var(--speed);   background: var(--speed-soft);   border-color: color-mix(in srgb, var(--speed) 30%, transparent); }
  .badge.risk    { color: var(--risk);    background: var(--risk-soft);    border-color: color-mix(in srgb, var(--risk) 30%, transparent); }
  .badge.outcome,
  .badge.revenue { color: var(--outcome); background: var(--outcome-soft); border-color: color-mix(in srgb, var(--outcome) 30%, transparent); }
  .badge.cost    { color: var(--cost);    background: var(--cost-soft);    border-color: color-mix(in srgb, var(--cost) 34%, transparent); }

  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn {
    font: inherit; font-size: 12.5px; font-weight: 560; cursor: pointer;
    background: var(--surface); color: var(--text-2);
    border: 1px solid var(--border-strong); border-radius: 8px; padding: 7px 12px;
  }
  .btn:hover { background: var(--surface-2); color: var(--text); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(1.06); background: var(--accent); color: #fff; }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 17px 19px; box-shadow: var(--shadow);
    margin-bottom: 14px;
  }
  .card h3 {
    font-size: 10.5px; font-weight: 690; letter-spacing: .07em; text-transform: uppercase;
    color: var(--text-3); margin-bottom: 11px; display: flex; align-items: center; gap: 8px;
  }
  .card h3::before { content: ""; width: 3px; height: 12px; border-radius: 2px; background: var(--accent); flex: none; }

  ul.plain { margin: 0; padding: 0; list-style: none; }
  ul.plain li { position: relative; padding: 4px 0 4px 17px; color: var(--text-2); font-size: 14px; }
  ul.plain li::before { content: ""; position: absolute; left: 3px; top: 12px; width: 5px; height: 5px; border-radius: 50%; background: var(--border-strong); }
  ul.plain li strong { color: var(--text); font-weight: 600; }

  .card p.body { margin: 0; font-size: 14px; color: var(--text-2); }
  .chip.key {
    background: var(--accent-soft); color: var(--accent-text); font-weight: 620;
    border-color: color-mix(in srgb, var(--accent) 34%, transparent);
  }
  .sub {
    font-size: 10.5px; font-weight: 660; letter-spacing: .06em; text-transform: uppercase;
    color: var(--text-3); margin: 13px 0 7px;
  }
  .card.goal h3::before { background: var(--outcome); }
  .card.impact h3::before { background: var(--speed); }
  .card.drv-speed   h3::before { background: var(--speed); }
  .card.drv-risk    h3::before { background: var(--risk); }
  .card.drv-revenue h3::before { background: var(--outcome); }
  .card.drv-cost    h3::before { background: var(--cost); }
  .who { font-size: 12px; font-weight: 620; color: var(--text-2); margin: -3px 0 9px; }

  .card.listen h3::before { background: var(--speed); }
  .lf { display: grid; gap: 7px; }
  .lf-q {
    display: block; font-size: 14px; font-style: italic; color: var(--text-2);
    background: var(--surface-2); border-left: 3px solid var(--speed);
    border-radius: 0 8px 8px 0; padding: 8px 12px;
  }
  .lf-note { font-size: 12px; color: var(--text-3); margin-top: 10px; }

  .card.value {
    background: var(--accent-soft);
    border-color: color-mix(in srgb, var(--accent) 30%, transparent);
  }
  .card.value p.body { color: var(--text); font-size: 15px; }

  .metric-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-size: 12.5px; padding: 5px 10px; border-radius: 7px;
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2);
  }

  /* ---------- Checklist ---------- */
  .checklist-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin: 30px 0 12px; }
  .checklist-head h2 { font-size: 18px; }
  .progress { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--text-3); }
  .bar { width: 128px; height: 6px; border-radius: 3px; background: var(--border); overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0%; background: var(--accent); transition: width .2s ease; }

  .group { margin-bottom: 12px; }
  .group-title {
    font-size: 12px; font-weight: 660; color: var(--text); margin: 0 0 8px;
    display: flex; align-items: baseline; gap: 8px;
  }
  .group-title span { font-size: 11px; font-weight: 500; color: var(--text-3); }

  .q {
    display: grid; grid-template-columns: 20px minmax(0,1fr); gap: 11px; align-items: start;
    padding: 8px 10px; border-radius: 8px; cursor: pointer; border: 1px solid transparent;
  }
  .q:hover { background: var(--surface-2); }
  .q input { appearance: none; -webkit-appearance: none; margin: 2px 0 0; width: 17px; height: 17px; flex: none;
    border: 1.5px solid var(--border-strong); border-radius: 5px; background: var(--surface); cursor: pointer; position: relative; }
  .q input:checked { background: var(--accent); border-color: var(--accent); }
  .q input:checked::after {
    content: ""; position: absolute; left: 5px; top: 1.5px; width: 4px; height: 9px;
    border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(43deg);
  }
  .q input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .q span { font-size: 14px; color: var(--text-2); line-height: 1.45; }
  .q input:checked + span { color: var(--text-3); text-decoration: line-through; text-decoration-color: var(--border-strong); }

  /* ---------- Objections ---------- */
  .obj { padding: 11px 0; border-top: 1px dashed var(--border); }
  .obj:first-of-type { border-top: 0; padding-top: 2px; }
  .obj b { display: block; font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
  .obj b::before { content: "“"; color: var(--text-3); }
  .obj b::after { content: "”"; color: var(--text-3); }
  .obj p { margin: 0; font-size: 13.5px; color: var(--text-2); }
  .obj p::before { content: "→ "; color: var(--accent-text); font-weight: 700; }

  .warn { border-color: color-mix(in srgb, var(--risk) 26%, var(--border)); }
  .warn h3::before { background: var(--risk); }
  .exit h3::before { background: var(--outcome); }

  /* ---------- Notes ---------- */
  textarea {
    width: 100%; min-height: 130px; resize: vertical; font: inherit; font-size: 14px;
    color: var(--text); background: var(--surface-2);
    border: 1px solid var(--border); border-radius: 9px; padding: 11px 13px;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

  .toast {
    position: fixed; bottom: 22px; left: 50%; transform: translate(-50%, 14px);
    background: var(--text); color: var(--bg); font-size: 13px; font-weight: 550;
    padding: 9px 16px; border-radius: 9px; opacity: 0; pointer-events: none;
    transition: opacity .18s ease, transform .18s ease; z-index: 50;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- Meeting setup ---------- */
  .att { display: grid; grid-template-columns: repeat(auto-fit, minmax(252px, 1fr)); gap: 12px; }
  .att-card {
    display: grid; gap: 7px; text-align: left; font: inherit; color: inherit; cursor: pointer;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 15px 16px; box-shadow: var(--shadow);
    transition: border-color .15s ease, background .15s ease;
  }
  .att-card:hover { border-color: var(--border-strong); }
  .att-card[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .att-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .att-top { display: flex; align-items: center; gap: 9px; }
  .att-name { font-size: 15px; font-weight: 620; letter-spacing: -0.01em; }
  .att-role { font-size: 12.5px; color: var(--text-3); line-height: 1.42; }
  .att-check {
    margin-left: auto; flex: none; width: 20px; height: 20px; border-radius: 6px;
    border: 1.5px solid var(--border-strong); background: var(--surface); position: relative;
  }
  .att-card[aria-pressed="true"] .att-check { background: var(--accent); border-color: var(--accent); }
  .att-card[aria-pressed="true"] .att-check::after {
    content: ""; position: absolute; left: 6px; top: 2.5px; width: 5px; height: 10px;
    border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(43deg);
  }

  .insight { display: block; padding: 9px 0; border-top: 1px dashed var(--border); font-size: 13.5px; color: var(--text-2); }
  .insight:first-of-type { border-top: 0; padding-top: 1px; }
  .insight b { color: var(--text); font-weight: 620; }

  .qtag {
    display: inline-block; font-size: 9.5px; font-weight: 720; letter-spacing: .05em;
    padding: 2px 6px; border-radius: 5px; margin-left: 6px; vertical-align: 1px;
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text-3);
  }
  .q input:checked + span .qtag { opacity: .5; }

  /* ---------- Decision tree ---------- */
  .node { padding: 14px 0; border-top: 1px dashed var(--border); }
  .node:first-of-type { border-top: 0; padding-top: 2px; }
  .node-q { font-size: 14px; font-weight: 600; color: var(--text); }
  .opts { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 9px; }
  .opt {
    font: inherit; font-size: 12.5px; font-weight: 550; cursor: pointer;
    padding: 6px 11px; border-radius: 8px;
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2);
  }
  .opt:hover { border-color: var(--border-strong); color: var(--text); }
  .opt[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .opt:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .read {
    margin-top: 10px; padding: 11px 13px; border-radius: 9px; font-size: 13.5px; color: var(--text-2);
    background: var(--surface-2); border: 1px solid var(--border); border-left: 3px solid var(--accent);
  }
  .read b { display: block; color: var(--text); font-weight: 620; margin-bottom: 3px; }
  .read .nx { display: block; margin-top: 7px; color: var(--accent-text); font-weight: 570; }
  .read .nx::before { content: "Next: "; font-weight: 720; }

  .posture { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 34%, transparent); }
  .posture h3::before { background: var(--accent); }
  .p-label { font-size: 20px; font-weight: 660; letter-spacing: -0.014em; color: var(--text); }
  .p-detail { font-size: 13.5px; color: var(--text-2); margin-top: 6px; }
  .p-open { font-size: 12.5px; color: var(--text-3); margin-top: 10px; }

  .locked, .empty { text-align: center; padding: 32px 22px; color: var(--text-3); font-size: 13.5px; }
  .locked b, .empty b { display: block; color: var(--text); font-size: 15px; font-weight: 620; margin-bottom: 7px; }
  .locked .btn, .empty .btn { margin-top: 14px; }

  .nav-item.dim { opacity: .4; }
  .nav-item.att-on .tag { box-shadow: inset 0 0 0 1.5px var(--accent); }

  /* ---------- Flashcards ---------- */
  .fc-stage { display: grid; place-items: center; padding: 8px 0 4px; }
  .fc {
    display: block;
    width: 100%; max-width: 620px; height: 320px; cursor: pointer;
    background: none; border: 0; padding: 0; margin: 0; font: inherit; color: inherit;
    perspective: 1400px;
  }
  .fc:focus-visible { outline: 2px solid var(--accent); outline-offset: 6px; border-radius: var(--radius); }
  .fc-inner {
    display: block;
    position: relative; width: 100%; height: 100%;
    transition: transform .5s cubic-bezier(.22,.75,.3,1); transform-style: preserve-3d;
  }
  .fc[data-flipped="true"] .fc-inner { transform: rotateY(180deg); }
  .fc-face {
    position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; text-align: center; padding: 30px 34px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow);
  }
  .fc-face.back { transform: rotateY(180deg); background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }
  .fc-tag {
    font-size: 10px; font-weight: 720; letter-spacing: .09em; text-transform: uppercase;
    color: var(--text-3);
  }
  .fc-face h2 { font-size: 25px; letter-spacing: -0.015em; }
  .fc-prompt { font-size: 13.5px; color: var(--text-3); }
  .fc-metrics { display: flex; flex-direction: column; gap: 9px; width: 100%; max-width: 400px; }
  .fc-metric {
    font-size: 16px; font-weight: 600; color: var(--accent-text);
    background: var(--surface); border: 1px solid color-mix(in srgb, var(--accent) 26%, transparent);
    border-radius: 9px; padding: 11px 14px;
  }
  .fc-controls { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
  .fc-count { font-size: 12.5px; color: var(--text-3); min-width: 62px; text-align: center; }
  .fc-hint { text-align: center; font-size: 12px; color: var(--text-3); margin-top: 14px; }

  @media (prefers-reduced-motion: reduce) {
    .fc-inner { transition: none; }
  }

  @media print {
    .side, .actions, .toast { display: none !important; }
    .app { display: block; }
    .main { max-width: none; padding: 0; }
    .card { break-inside: avoid; box-shadow: none; }
    body { background: #fff; }
  }
</style>
</head>
<body>
<div class="app">
  <nav class="side">
    <div class="brand">
      <div class="brand-dot"></div>
      <div>
        <div class="brand-name">Persona Playbook</div>
        <div class="brand-sub">Solution Architect edition</div>
      </div>
    </div>
    <div class="nav-label">This meeting</div>
    <div id="nav-meeting"></div>
    <div class="nav-label">Before any meeting</div>
    <div id="nav-common"></div>
    <div class="nav-label">Buyer personas</div>
    <div id="nav-personas"></div>
    <div class="nav-label">Recall</div>
    <div id="nav-drill"></div>
    <div class="side-foot">
      Press <span class="kbd">1</span>–<span class="kbd">9</span> and <span class="kbd">0</span> to switch tabs. Attendees, answers, and notes save to this browser.
    </div>
  </nav>

  <main class="main" id="main"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";

/* ============================================================
   DATA
   ============================================================ */

const COMMON = {
  id: "common",
  tag: "ALL",
  name: "Every Meeting",
  driver: [],
  role: "The two-beat structure behind every persona scenario: ask how they do it today, then position against the gap that surfaces. Never open with the product.",
  owns: null,
  cares: [
    "Same product, different framing per seat at the table. Match the frame to the category that person is measured on.",
    "<strong>Personas sit in more than one category.</strong> CIO/CISO is risk <em>and</em> cost. Platform Engineering is risk, cost, and sometimes revenue.",
    "<strong>Speed and risk pull against each other.</strong> When both are in the room, name the tension before they do.",
    "The category tells you decision <em>speed</em> and risk appetite, not just vocabulary — a cost-driven buyer moves on the budget cycle, a speed-driven one on the sprint."
  ],
  metrics: null,
  discovery: [
    { title: "Prep", note: "before you walk in", items: [
      "Confirmed who is in the room, their persona, and who the real decision-maker is",
      "Read the account history — prior POCs, open opportunities, existing footprint",
      "Checked whether they already use Postman anywhere in the org (and how)",
      "Identified which of the three drivers (speed / risk / outcomes) this person is measured on",
      "Prepared one current-state question I genuinely do not know the answer to",
      "Prepared a demo path that runs against something recognisable to them, not a generic sample"
    ]},
    { title: "Open", note: "first 10 minutes", items: [
      "Stated the purpose and the time box, and asked what they want out of the meeting",
      "Asked the current-state question first — resisted opening with product",
      "Established what 'good' looks like in their words before positioning anything",
      "Confirmed the technical and commercial constraints early (security review, budget cycle, timeline)"
    ]},
    { title: "Close", note: "last 10 minutes", items: [

const STORE_KEY = "postman-persona-playbook.v1";
const state = load();
let current = "setup";   // SETUP_ID, declared below — literal here to stay out of its TDZ

function load() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }
  catch { return {}; }
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
  catch { /* private browsing — session-only is acceptable */ }
}
function entry(id) {
  if (!state[id]) state[id] = { checked: {}, notes: "" };
  return state[id];
}

/* The meeting: who is actually in the room. Empty attendee list = browsing mode,
   every persona open. Once someone is selected, only attendees can be interrogated. */
const SETUP_ID = "setup";
const SESSION_ID = "session";

function meeting() {
  if (!state.__meeting) state.__meeting = { attendees: [], notes: "" };
  if (!Array.isArray(state.__meeting.attendees)) state.__meeting.attendees = [];
  return state.__meeting;
}
const isConfigured = () => meeting().attendees.length > 0;
const isAttending = id => meeting().attendees.includes(id);
const attendees = () => PERSONAS.filter(p => isAttending(p.id));

function toggleAttendee(id) {
  const m = meeting();
  const i = m.attendees.indexOf(id);
  if (i === -1) m.attendees.push(id); else m.attendees.splice(i, 1);
  m.attendees.sort((a, b) => PERSONAS.findIndex(p => p.id === a) - PERSONAS.findIndex(p => p.id === b));
  save();
}

/* Merge every attendee's discovery questions into one agenda ordered by stage,
   so a mixed room is worked stage by stage rather than persona by persona.
   Identical questions asked by two personas collapse into one, tagged with both. */
const STAGE_ORDER = ["Current state", "Pain and impact", "Technical fit", "Decision and process", "Success criteria"];

function buildAgenda() {
  const stages = new Map();
  attendees().forEach(p => {
    p.discovery.forEach((g, gi) => {
      if (!stages.has(g.title)) stages.set(g.title, { title: g.title, note: g.note, items: new Map() });
      const bucket = stages.get(g.title).items;
      g.items.forEach((text, ii) => {
        const k = text.trim().toLowerCase();
        if (!bucket.has(k)) bucket.set(k, { text, sources: [] });
        bucket.get(k).sources.push({ pid: p.id, tag: p.tag, key: `${gi}.${ii}` });
      });
    });
  });
  const seen = [...stages.keys()];
  const order = [...STAGE_ORDER.filter(t => seen.includes(t)), ...seen.filter(t => !STAGE_ORDER.includes(t))];
  return order.map(t => ({ ...stages.get(t), items: [...stages.get(t).items.values()] }));
}

const itemDone = it => it.sources.every(s => entry(s.pid).checked[s.key]);
function setItem(it, on) {
  it.sources.forEach(s => { entry(s.pid).checked[s.key] = on; });
  save();
}

/* Read the room: what the combination of attendees implies for how you run it. */
function meetingInsights() {
  const who = attendees();
  const out = [];
  if (!who.length) return out;

  const cats = new Set(who.flatMap(p => p.driver));
  const has = id => who.some(p => p.id === id);

  if (cats.has("speed") && cats.has("risk")) out.push(["Speed and risk are both in the room.", "These pull against each other. Name the tension before they do — whoever you leave unaddressed becomes the objection after you leave."]);
  if (!cats.has("revenue") && !cats.has("cost")) out.push(["No economic buyer present.", "Everyone here is technical. Your exit criterion is a name: who owns the budget, and who has to say yes?"]);
  if (has("cio")) out.push(["Executive in the room.", "Expect a short window and interruptions. Lead with consolidation and risk framing, not features. Have SSO, RBAC, residency, and the security questionnaire ready."]);
  if (who.length === 1) out.push(["Single-threaded.", "One persona is one point of failure. Ask who else touches this problem and get the next introduction before you leave."]);
  if (who.length >= 4) out.push(["Large room.", "You will not get depth on everything. Pick two stages, go deep, and take the rest to follow-ups."]);
  if (has("platform") && has("product")) out.push(["Platform plus Product together.", "Product feels the pain, Platform owns the fix and the budget. Let Product describe the breakage, then ask Platform what it would take to prevent it."]);
  if (has("apo") && (has("product") || has("platform"))) out.push(["Business and engineering in one room.", "Rare and valuable. Get the revenue metric stated out loud in front of the engineers — it reframes the whole evaluation."]);
  return out;
}
function totalQuestions(p) {
  return p.discovery.reduce((n, g) => n + g.items.length, 0);
}
function checkedCount(p) {
  const c = entry(p.id).checked;
  return Object.keys(c).filter(k => c[k]).length;
}

const esc = s => String(s).replace(/[&<>"]/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]));
const list = items => `<ul class="plain">${items.map(i => `<li>${i}</li>`).join("")}</ul>`;

function renderNav() {
  const build = p => {
    const total = totalQuestions(p);
    const done = checkedCount(p);
    const pct = total ? Math.round((done / total) * 100) : 0;
    const locked = isConfigured() && p.id !== COMMON.id && !isAttending(p.id);
    const cls = ["nav-item", locked ? "dim" : "", (isConfigured() && isAttending(p.id)) ? "att-on" : ""].filter(Boolean).join(" ");
    return `<button class="${cls}" data-id="${p.id}" aria-current="${p.id === current}">
      <span class="tag">${esc(p.tag)}</span>
      <span>
        <span class="nav-title">${esc(p.name)}</span>
        <span class="nav-meta">${locked ? "not in this meeting"
          : `<span class="mini-bar"><i style="width:${pct}%"></i></span>${done}/${total}`}</span>
      </span>
    </button>`;
  };

  const n = meeting().attendees.length;
  const agenda = n ? buildAgenda() : [];
  const qs = agenda.reduce((a, g) => a + g.items.length, 0);
  const asked = agenda.reduce((a, g) => a + g.items.filter(itemDone).length, 0);

  document.getElementById("nav-meeting").innerHTML = `
    <button class="nav-item" data-id="${SETUP_ID}" aria-current="${current === SETUP_ID}">
      <span class="tag">WHO</span>
      <span>
        <span class="nav-title">Meeting setup</span>
        <span class="nav-meta">${n ? `${n} attending` : "no one selected yet"}</span>
      </span>
    </button>
    <button class="nav-item ${n ? "" : "dim"}" data-id="${SESSION_ID}" aria-current="${current === SESSION_ID}">
      <span class="tag">LIVE</span>
      <span>
        <span class="nav-title">Live session</span>
        <span class="nav-meta">${n
          ? `<span class="mini-bar"><i style="width:${qs ? (asked / qs) * 100 : 0}%"></i></span>${asked}/${qs}`
          : "pick attendees first"}</span>
      </span>
    </button>`;

  document.getElementById("nav-common").innerHTML = build(COMMON);
  document.getElementById("nav-personas").innerHTML = PERSONAS.map(build).join("");
  document.getElementById("nav-drill").innerHTML = `<button class="nav-item" data-id="${DRILL_ID}" aria-current="${current === DRILL_ID}">
      <span class="tag">CARD</span>
      <span>
        <span class="nav-title">Metrics flashcards</span>
        <span class="nav-meta">${PERSONAS.length} cards &middot; self-test</span>
      </span>
    </button>`;
  document.querySelectorAll(".nav-item").forEach(b =>
    b.addEventListener("click", () => select(b.dataset.id))
  );
}

function renderMain() {

  if (current === SETUP_ID) return renderSetup();
  if (current === SESSION_ID) return renderSession();
  const p = ALL.find(x => x.id === current);
  const e = entry(p.id);
  const total = totalQuestions(p);
  const done = checkedCount(p);

  const notes = document.getElementById("notes");
  notes.addEventListener("input", () => { e.notes = notes.value; save(); });

  document.getElementById("btn-print").addEventListener("click", () => window.print());
  document.getElementById("btn-export").addEventListener("click", () => exportDebrief(p));
  document.getElementById("btn-reset").addEventListener("click", () => {
    if (!confirm(`Clear checklist and notes for ${p.name}?`)) return;
    state[p.id] = { checked: {}, notes: "" };
    save(); renderNav(); renderMain();
  });
}

function exportDebrief(p) {
  const e = entry(p.id);
  const lines = [`# ${p.name} — meeting debrief`, ""];

  p.discovery.forEach((g, gi) => {
    const asked = g.items.filter((_, ii) => e.checked[`${gi}.${ii}`]);
    const missed = g.items.filter((_, ii) => !e.checked[`${gi}.${ii}`]);
    if (!asked.length && !missed.length) return;
    lines.push(`## ${g.title}`);
    asked.forEach(i => lines.push(`- [x] ${i}`));
    missed.forEach(i => lines.push(`- [ ] ${i}`));
    lines.push("");
  });

  const t = totalQuestions(p), d = checkedCount(p);
  lines.push(`**Coverage:** ${d}/${t} questions asked`, "");
  if (e.notes.trim()) lines.push("## Notes", "", e.notes.trim(), "");
  lines.push("## Do not leave without", ...p.exit.map(x => `- [ ] ${x}`));

  const text = lines.join("\n");
  navigator.clipboard.writeText(text)
    .then(() => toast("Debrief copied as Markdown"))
    .catch(() => toast("Copy failed — check clipboard permissions"));
}

/* ============================================================
   DECISION TREE
   Four qualification questions asked of any room, plus one branch per
   attending persona. Each answer yields a read and a next step; the
   qualification spine resolves to an overall posture.
   ============================================================ */

const TREE = [
  { id: "initiative", scope: "all", q: "Is there a named, funded initiative behind this?", options: [
    { label: "Yes, funded", read: "A real project with money attached. The evaluation is about fit, not persuasion.", next: "Scope a pilot with a named success metric and a date. Ask what else is competing for the same budget." },
    { label: "Named, not funded", read: "Someone cares, but nobody has paid for it. You are building a business case, not running an evaluation.", next: "Get the baseline number and co-write the internal case with your champion. Find out when the budget cycle opens." },
    { label: "Nothing yet", read: "Education stage. A POC now would burn goodwill and prove nothing anyone is accountable for.", next: "Do not scope a POC. Find the triggering event — an audit, incident, launch, or re-org — and anchor a follow-up to it." }
  ]},
  { id: "baseline", scope: "all", q: "Can they state a current-state number for their main pain?", options: [
    { label: "Yes, measured", read: "You have something to move. Every later claim can be tested against it.", next: "Anchor the pilot on moving that specific number, and agree what change counts as success." },
    { label: "Rough estimate", read: "Directionally useful, but it will not survive a business case review.", next: "Offer to help them measure it properly — that exercise is itself a reason for a follow-up meeting." },
    { label: "Not tracked", read: "No baseline means no business case, and no way to prove value later. This is the single most common reason a good POC fails to convert.", next: "Make measurement the next step, not a demo. Agree what to instrument and who will own the number." }
  ]},
  { id: "sponsor", scope: "all", q: "Is the approval path identified?", options: [
    { label: "Yes, named", read: "You know who signs and who can block. Multi-threading has a target.", next: "Get an introduction or an agreed path to that person, and ask your champion what would make them say no." },
    { label: "Partly", read: "You know some of the room but not the decision. Deals stall here more than anywhere.", next: "Map the rest explicitly — ask who else has to agree, and what procurement and security require." },
    { label: "No idea", read: "Interest without a path. Enthusiasm at this stage is not a signal.", next: "Before anything technical, ask directly: if this works, what has to happen for it to get bought?" }
  ]},
  { id: "incumbent", scope: "all", q: "What is in place today?", options: [
    { label: "A commercial tool", read: "Displacement. You need a reason to switch that outweighs the cost of switching — 'better' is not enough.", next: "Find what the incumbent structurally cannot do, and get the renewal date." },
    { label: "Homegrown", read: "Your competitor is sunk cost and pride. Attacking the build is attacking the builder, who is probably in the room.", next: "Ask what it costs to maintain and what it does not cover. Position as removing burden, never as replacing their judgement." },
    { label: "Nothing formal", read: "Greenfield. No switching cost, but also no proven appetite — nobody has felt the problem enough to solve it yet.", next: "Establish the cost of the status quo first. Without that, there is no urgency and the deal drifts." }
  ]},

  { id: "gov", scope: "platform", q: "How is API governance enforced today?", options: [
    { label: "Manual review", read: "The strongest wedge available. Review hours are visible, hated, and easy to quantify.", next: "Count the design-review hours per week and show the same check running in CI." },
    { label: "Partly automated", read: "They believe in the model already. The gap is coverage, not conviction.", next: "Find which standards are not enforced and why — that gap is your scope." },
    { label: "Nothing formal", read: "Do not lead with policy. Enforcement on an estate nobody can see is unsellable.", next: "Start with inventory and visibility. Answer 'how many APIs do we have' before proposing to govern them." }
  ]},
  { id: "breaking", scope: "product", q: "Do they catch breaking changes before release?", options: [
    { label: "Reliably", read: "Speed, not safety, is your angle here. They have solved the fear.", next: "Pivot to lead time and parallel work — mocks, earlier starts, less waiting between roles." },
    { label: "Sometimes", read: "Inconsistent coverage. There is a recent incident behind this answer — find it.", next: "Ask for the last escape and what it cost. Reproduce that class of failure in a contract test." },
    { label: "Not really", read: "High pain, high urgency, and the demo almost writes itself.", next: "Demo a breaking change failing in a pull request against their own spec." }
  ]},
  { id: "compliance", scope: "quality", q: "Is there a named compliance regime with an audit date?", options: [
    { label: "Yes, dated", read: "A deadline you did not have to manufacture. This is the strongest forcing function in the deck.", next: "Work backwards from the audit date and show evidence output an auditor would accept unedited." },
    { label: "Internal standards only", read: "Real but soft. No external deadline means it slips whenever something louder appears.", next: "Tie the work to escaped defects or release confidence instead — find the metric with teeth." },
    { label: "Neither", read: "Quality is aspirational here. Be careful how much you invest.", next: "Qualify hard: who is accountable if quality slips, and what happens to them? If nobody, deprioritise." }
  ]},
  { id: "ttfc", scope: "apo", q: "Do they know their time-to-first-successful-call?", options: [
    { label: "Yes, measured", read: "A commercially literate buyer. They can build the case themselves once you give them the lever.", next: "Model the revenue impact of halving it and let them check your arithmetic." },
    { label: "Anecdotal", read: "They feel the pain but cannot price it, so it loses to whatever is quantified.", next: "Walk one real partner onboarding end to end and time each step with them in the room." },
    { label: "Not tracked", read: "The gap itself is the pitch — they own adoption but cannot see where it stalls.", next: "Lead with visibility, not onboarding. You cannot fix a funnel nobody can see." }
  ]},
  { id: "poc", scope: "gtm", q: "Is there a defined, repeatable POC process?", options: [
    { label: "Defined", read: "A baseline exists, so improvement is measurable. Unusual and useful.", next: "Target the win rate directly and agree the comparison window." },
    { label: "Ad hoc per rep", read: "Every SE has their own kit and none of it compounds. The cost is invisible but large.", next: "Rebuild one flagship demo as a reusable asset and measure prep time on the next three." },
    { label: "No process", read: "Nothing to improve against, and no way to prove you helped.", next: "Define the process with them first. Without a baseline, any win is deniable." }
  ]},
  { id: "mandate", scope: "cio", q: "Is there a consolidation or governance mandate this year?", options: [
    { label: "Active mandate", read: "Top-down air cover. This is the fastest executive path available to you.", next: "Lead with the consolidation math — name what this replaces and the combined current spend." },
    { label: "Cost pressure, no mandate", read: "The appetite is there but nothing is forcing a decision this cycle.", next: "Frame as cost avoidance against a specific renewal or headcount plan, and find the next budget gate." },
    { label: "Neither", read: "You are below their line. Feature conversations with an executive without a mandate go nowhere.", next: "Work the technical personas, build a case from the bottom, and come back with numbers." }
  ]}
];

const visibleNodes = () => TREE.filter(n => n.scope === "all" || isAttending(n.scope));
function answers() {
  const m = meeting();
  if (!m.answers) m.answers = {};
  return m.answers;
}

/* The qualification spine resolves to a posture — what this deal actually is right now. */
function posture() {
  const a = answers();
  const got = id => a[id] !== undefined;
  const spine = ["initiative", "baseline", "sponsor", "incumbent"];
  const open = spine.filter(id => !got(id));
  if (open.length === spine.length) {
    return { label: "Not yet assessed", detail: "Answer the qualification questions below and this resolves to a posture.", open };
  }
  if (a.initiative === 2) {
    return { label: "Too early — educate", detail: "No initiative means no deal this cycle. Your job is to find the triggering event and be the person they call when it happens. Do not spend POC effort here.", open };
  }
  if (a.baseline === 2) {
    return { label: "Blocked on a baseline", detail: "There is appetite but nothing measurable. Any value you deliver will be arguable and any POC will end in opinion. Make measurement the next step.", open };
  }
  if (a.sponsor === 2) {
    return { label: "Multi-thread before you build", detail: "You have interest without a path to a decision. More technical depth will not fix that — another name will.", open };
  }
  if (a.initiative === 0 && a.baseline === 0 && a.sponsor === 0) {
    return { label: "Ready to scope a pilot", detail: "Funded, measurable, and with a known approval path. Convert now: agree scope, metric, and date before the energy in the room decays.", open };
  }
  return { label: "Build the case", detail: "The pieces are partly in place. Close the gaps below — usually the missing one is a number or a name, not a technical proof point.", open };
}

function exportSession(agenda, who, m) {
  const lines = [`# Discovery debrief`, "", `**In the room:** ${who.map(p => p.name).join(", ")}`, ""];
  agenda.forEach(g => {
    lines.push(`## ${g.title}`);
    g.items.forEach(it => {
      const tags = it.sources.map(s => s.tag).join("/");
      lines.push(`- [${itemDone(it) ? "x" : " "}] ${it.text} _(${tags})_`);
    });
    lines.push("");
  });
  const total = agenda.reduce((a, g) => a + g.items.length, 0);
  const done = agenda.reduce((a, g) => a + g.items.filter(itemDone).length, 0);
  lines.push(`**Coverage:** ${done}/${total} questions asked`, "");

  const pos = posture();
  lines.push("## Deal posture", "", `**${pos.label}** — ${pos.detail}`, "");

  const nodes = visibleNodes().filter(n => answers()[n.id] !== undefined);
  if (nodes.length) {
    lines.push("## What we learned", "");
    nodes.forEach(n => {
      const o = n.options[answers()[n.id]];
      lines.push(`- **${n.q.replace(/\?$/, "")}:** ${o.label}`, `  - ${o.read}`, `  - **Next:** ${o.next}`);
    });
    lines.push("");
  }

  if ((m.notes || "").trim()) lines.push("## Notes", "", m.notes.trim(), "");
  lines.push("## Do not leave without", "");
  who.forEach(p => { lines.push(`### ${p.name}`); p.exit.forEach(x => lines.push(`- [ ] ${x}`)); lines.push(""); });

  navigator.clipboard.writeText(lines.join("\n"))
    .then(() => toast("Session debrief copied as Markdown"))
    .catch(() => toast("Copy failed — check clipboard permissions"));
}

/* ============================================================
   FLASHCARD DRILL
   ============================================================ */

const DRILL_ID = "drill";
const drill = { order: PERSONAS.map((_, i) => i), i: 0, flipped: false };

function renderDrill() {
  const p = PERSONAS[drill.order[drill.i]];
  document.getElementById("main").innerHTML = `
    <header class="head">
      <div>
        <h1>Metrics flashcards</h1>
        <p class="role-line">Knowing which metrics each persona cares about is what lets you tailor the pitch. Name the metrics before you flip.</p>
      </div>
      <div class="actions"><button class="btn" id="fc-shuffle">Shuffle</button></div>
    </header>
    <div style="height:20px"></div>

    <div class="fc-stage">
      <button class="fc" id="fc" type="button" data-flipped="${drill.flipped}"
              aria-label="Flashcard for ${esc(p.name)} — activate to flip">
        <div class="fc-inner">
          <div class="fc-face">
            <span class="fc-tag">${esc(p.tag)}</span>
            <h2>${esc(p.name)}</h2>
            <span class="fc-prompt">Which metrics drive their decisions?</span>
          </div>
          <div class="fc-face back">
            <span class="fc-tag">${esc(p.name)}</span>
            <div class="fc-metrics">${p.metricsKey.map(m => `<div class="fc-metric">${esc(m)}</div>`).join("")}</div>
          </div>
        </div>
      </button>
    </div>

    <div class="fc-controls">
      <button class="btn" id="fc-prev">&larr; Previous</button>
      <span class="fc-count">${drill.i + 1} / ${PERSONAS.length}</span>
      <button class="btn" id="fc-next">Next &rarr;</button>
    </div>
    <p class="fc-hint">
      <span class="kbd">Space</span> to flip &middot;
      <span class="kbd">&larr;</span> <span class="kbd">&rarr;</span> to move &middot;
      <span class="kbd">S</span> to shuffle
    </p>
  `;
  document.getElementById("fc").addEventListener("click", flipCard);
  document.getElementById("fc-prev").addEventListener("click", () => stepCard(-1));
  document.getElementById("fc-next").addEventListener("click", () => stepCard(1));
  document.getElementById("fc-shuffle").addEventListener("click", shuffleDeck);
}

function flipCard() {
  drill.flipped = !drill.flipped;
  document.getElementById("fc").dataset.flipped = String(drill.flipped);
}

function stepCard(delta) {
  drill.i = (drill.i + delta + PERSONAS.length) % PERSONAS.length;
  drill.flipped = false;
  renderDrill();
  document.getElementById("fc").focus();
}

function shuffleDeck() {
  for (let i = drill.order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [drill.order[i], drill.order[j]] = [drill.order[j], drill.order[i]];
  }
  drill.i = 0;
  drill.flipped = false;
  renderDrill();
  toast("Deck shuffled");
}

let toastTimer;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
}

function select(id) {
  current = id;
  if (location.hash.slice(1) !== id) history.replaceState(null, "", "#" + id);
  renderNav();
  renderMain();
  window.scrollTo({ top: 0 });
}

const NAV_ORDER = [SETUP_ID, SESSION_ID, ...ALL.map(x => x.id), DRILL_ID];
const VALID_IDS = NAV_ORDER;
if (VALID_IDS.includes(location.hash.slice(1))) current = location.hash.slice(1);
window.addEventListener("hashchange", () => {
  const id = location.hash.slice(1);
  if (VALID_IDS.includes(id) && id !== current) select(id);
});

document.addEventListener("keydown", ev => {
  if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
  if (/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) return;

  if (current === DRILL_ID) {
    const onCard = document.activeElement && document.activeElement.id === "fc";
    if (ev.key === " " || ev.key === "Enter") {
      if (onCard) return;           // let the button's native click flip it
      ev.preventDefault(); flipCard(); return;
    }
    if (ev.key === "ArrowRight") { ev.preventDefault(); stepCard(1); return; }
    if (ev.key === "ArrowLeft")  { ev.preventDefault(); stepCard(-1); return; }
    if (ev.key === "s" || ev.key === "S") { shuffleDeck(); return; }
  }

  if (!/^[0-9]$/.test(ev.key)) return;
  const idx = ev.key === "0" ? 9 : parseInt(ev.key, 10) - 1;
  if (idx < NAV_ORDER.length) select(NAV_ORDER[idx]);
});

renderNav();
renderMain();
</script>
</body>
</html>
